name = "classroompilot-gateway"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["global_fetch_strictly_public"]

routes = [{ pattern = "mcp.classroom.raycode.tech", custom_domain = true }]

# [[d1_databases]]
# binding = "DB"
# database_name = "classroompilot"
# database_id = "<fill after d1 create>"
# migrations_dir = "migrations"

[[kv_namespaces]]
binding = "OAUTH_KV"
# No id: wrangler creates the namespace on first deploy.

[vars]
PUBLIC_BASE_URL = "https://mcp.classroom.raycode.tech"

# Secrets (set with `wrangler secret put`): GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, TOKEN_ENC_KEY
